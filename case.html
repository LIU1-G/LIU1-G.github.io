<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目详情</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}

html{scroll-behavior:smooth}
body{
  background:linear-gradient(160deg,#fed7aa 0%,#ffedd5 50%,#fff7ed 100%);
  color:#111111;
  line-height:1.9;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.container{
  max-width:920px;
  margin:0 auto;
  padding:3rem 2rem;
}

/* ===== 返回按钮 ===== */
.back{
  display:inline-flex;
  align-items:center;
  gap:.45rem;
  margin-bottom:2.2rem;
  padding:.55rem 1.1rem;
  background:#ffffff;
  border:1px solid #c2410c;
  color:#c2410c;
  text-decoration:none;
  border-radius:10px;
  font-size:.9rem;
  font-weight:500;
  box-shadow:0 2px 8px rgba(194,65,12,.12);
  transition:transform .25s ease,background .25s ease,color .25s ease,box-shadow .25s ease;
}
.back:hover{
  transform:translateY(-2px);
  background:#c2410c;
  color:#ffffff;
  box-shadow:0 6px 18px rgba(194,65,12,.25);
}

/* ===== 标题 ===== */
h1{
  font-size:1.9rem;
  margin-bottom:1.6rem;
  line-height:1.4;
  color:#000000;
  padding-left:1rem;
  border-left:3px solid #c2410c;
  font-weight:700;
}

/* ===== 正文内容 ===== */
.content{
  color:#111111;
  background:#ffffff;
  padding:1.8rem 2rem;
  border-radius:14px;
  border:1px solid rgba(194,65,12,.12);
  box-shadow:0 4px 20px rgba(194,65,12,.1);
}
.content p{
  margin:.75rem 0;
  font-size:.97rem;
  line-height:1.95;
  color:#333333;
}
.content strong{
  color:#c2410c;
  font-weight:600;
  margin-right:.3rem;
}

/* ===== Gitee 仓库按钮 ===== */
.repo-link{
  display:inline-flex;
  align-items:center;
  gap:.45rem;
  margin-top:1.4rem;
  padding:.65rem 1.3rem;
  background:#c2410c;
  color:#ffffff;
  border-radius:10px;
  font-size:.92rem;
  font-weight:500;
  text-decoration:none;
  box-shadow:0 2px 8px rgba(194,65,12,.28);
  transition:transform .25s ease,box-shadow .25s ease,background .25s ease;
}
.repo-link:hover{
  transform:translateY(-3px);
  background:#9a3412;
  box-shadow:0 6px 18px rgba(194,65,12,.4);
}

/* ===== 移动端适配 ===== */
@media (max-width:768px){
  .container{padding:1.6rem 1.1rem}
  h1{font-size:1.45rem;padding-left:.7rem}
  .content{padding:1.3rem 1.2rem;border-radius:12px}
  .content p{font-size:.92rem;line-height:1.85}
  .back{padding:.5rem .95rem;font-size:.85rem}
}
@media (max-width:420px){
  h1{font-size:1.25rem}
  .content p{font-size:.88rem}
  .repo-link{padding:.55rem 1rem;font-size:.85rem}
}
</style>
</head>
<body>
<div class="container">
<a class="back" href="index.html">← 返回首页</a>
<div id="container"></div>
</div>
<script>
const projects = {
  cloud:{
    title:"云创社综合平台｜开源全栈AI项目",
    content:`
<p><strong>时间：</strong>2026.05 – 2026.06｜<strong>角色：</strong>独立全栈开发</p>
<p><strong>技术栈：</strong>React+Vite、FastAPI、MySQL、Docker、阿里云百炼</p>
<p><strong>简介：</strong>AI-Native全栈Web项目，支持SSE流式对话、会话记忆、多模态解析、后台异步任务。涵盖AI面试、多模态助手、后台管理等核心模块。</p>
<a class="repo-link" href="https://gitee.com/liuziqiongwjk/cloud-innovation-club" target="_blank">🔗 Gitee 仓库</a>
    `
  },
  vla:{
    title:"机器人VLA数据集可视化校验工具",
    content:`
<p><strong>技术栈：</strong>Python FastAPI、OpenCV、Pandas(PyArrow)、ECharts、JavaScript</p>
<p><strong>简介：</strong>适配 LeRobot v3.0 数据格式，双摄视频逐帧回放，关节/力控时序数据可视化，支撑机器人学习大赛产线数据大屏展示。</p>
<a class="repo-link" href="https://gitee.com/liuziqiongwjk/vla_data" target="_blank">🔗 Gitee 仓库</a>
    `
  },
  leap:{
    title:"Leap AI 面试系统",
    content:`
<p><strong>简介：</strong>AI驱动的智能面试助手与评估系统，基于大语言模型实现自动化面试流程、智能追问、答案评估与综合评分，帮助企业提升面试效率与标准化程度。</p>
<p><strong>技术方向：</strong>LLM Agent、Prompt Engineering、流式交互、后端服务</p>
<a class="repo-link" href="https://gitee.com/liuziqiongwjk/leap-interview" target="_blank">🔗 Gitee 仓库</a>
    `
  },
  math:{
    title:"数模解题辅助平台",
    content:`
<p><strong>简介：</strong>面向数学建模竞赛与科研场景的AI辅助工具，提供数据清洗、指标计算、模型推荐、论文草稿生成等能力，帮助建模团队快速完成从问题分析到报告产出的全流程。</p>
<p><strong>技术方向：</strong>AI Agent、数据分析、自动化报告</p>
<a class="repo-link" href="https://gitee.com/math-agent/math-agent" target="_blank">🔗 Gitee 仓库</a>
    `
  }
}
const params = new URLSearchParams(location.search)
const id = params.get("id")
const data = projects[id]
if(!data){
  document.getElementById("container").innerHTML = "<h1>项目不存在</h1>"
}else{
  document.getElementById("container").innerHTML = `<h1>${data.title}</h1><div class="content">${data.content}</div>`
}
</script>
</body>
</html>
