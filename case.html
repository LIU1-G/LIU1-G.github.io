<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目详情 · 刘紫琼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Noto+Sans+SC:wght@300;400;500;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06080f;--bg-2:#0b0f1a;--bg-3:#121a2e;
  --cyan:#00e5ff;--lime:#a3e635;--violet:#8b5cf6;
  --text:#e6edf7;--muted:#7b8ba8;
  --glass:rgba(255,255,255,0.04);--border:rgba(0,229,255,0.15);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Noto Sans SC',system-ui,sans-serif;line-height:1.7;overflow-x:hidden}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(ellipse 80% 50% at 20% 0%,rgba(139,92,246,0.15),transparent),
    radial-gradient(ellipse 60% 40% at 80% 20%,rgba(0,229,255,0.12),transparent);
  pointer-events:none;
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;
  background-image:
    linear-gradient(var(--border) 1px,transparent 1px),
    linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,black,transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,black,transparent 80%);
  pointer-events:none;opacity:0.4;
}

.wrap{max-width:900px;margin:0 auto;padding:0 2rem}

nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:rgba(6,8,15,0.7);border-bottom:1px solid var(--border)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem}
.logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:1.1rem;color:var(--cyan);letter-spacing:2px;text-transform:uppercase;text-decoration:none}
.logo span{color:var(--lime)}
.back{font-family:'JetBrains Mono',monospace;font-size:0.85rem;color:var(--muted);text-decoration:none;transition:color .2s}
.back:hover{color:var(--cyan)}

.hero{padding:4rem 0 2rem}
.hero .tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:0.72rem;padding:0.3rem 0.8rem;border:1px solid var(--cyan);color:var(--cyan);border-radius:999px;letter-spacing:2px;text-transform:uppercase;margin-bottom:1.2rem}
.hero h1{font-family:'Orbitron',sans-serif;font-size:clamp(1.8rem,4.5vw,2.8rem);font-weight:900;background:linear-gradient(135deg,#fff,var(--cyan),var(--lime));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px;line-height:1.3}

.meta-row{display:flex;flex-wrap:wrap;gap:0.8rem;margin:2rem 0 3rem}
.meta-chip{font-family:'JetBrains Mono',monospace;font-size:0.75rem;padding:0.4rem 0.9rem;background:var(--glass);border:1px solid var(--border);border-radius:6px;color:var(--text)}
.meta-chip b{color:var(--lime);font-weight:600;margin-right:0.4rem}

.content{font-size:1rem;color:#cbd5e1}
.content p{margin:1rem 0}
.content strong{color:#fff}
.content h3{font-family:'JetBrains Mono',monospace;color:var(--cyan);margin:2rem 0 1rem;font-size:0.95rem;letter-spacing:1px}
.content ul{padding-left:1.2rem;margin:0.5rem 0}
.content li{margin:0.3rem 0;color:#cbd5e1}

.repo-link{display:inline-flex;align-items:center;gap:0.5rem;margin-top:2.5rem;padding:0.8rem 1.6rem;font-family:'JetBrains Mono',monospace;font-size:0.85rem;font-weight:600;text-decoration:none;border-radius:8px;background:linear-gradient(135deg,var(--cyan),#0099ff);color:#000;transition:transform .2s,box-shadow .2s}
.repo-link:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,229,255,0.35)}

.not-found{text-align:center;padding:6rem 0}
.not-found h1{font-family:'Orbitron',sans-serif;font-size:3rem;color:var(--violet);margin-bottom:1rem}

footer{text-align:center;padding:3rem 0;border-top:1px solid var(--border);margin-top:4rem;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:0.8rem}

.reveal{opacity:0;transform:translateY(18px);transition:opacity .5s ease,transform .5s ease}
.reveal.in{opacity:1;transform:none}

@media(max-width:640px){
  .wrap{padding:0 1.2rem}
  nav .wrap{padding:0.8rem 1.2rem}
  .hero{padding:2.5rem 0 1rem}
}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="logo" href="index.html">LIU<span>.dev</span></a>
    <a class="back" href="index.html">← 返回首页</a>
  </div>
</nav>

<div class="wrap">
  <div id="app"></div>
</div>

<footer>© 2026 liuziqiongwjk</footer>

<script>
const projects = {
  cloud:{
    id:"01",
    category:"FULL-STACK · AI PLATFORM",
    title:"云创社综合平台",
    meta:[
      {k:"时间","v":"2026.05 – 2026.06"},
      {k:"角色","v":"独立全栈开发"},
      {k:"技术栈","v":"React+Vite · FastAPI · MySQL · Docker · 阿里云百炼"},
      {k:"类型","v":"开源项目"}
    ],
    html:`
      <p>AI-Native 全栈 Web 项目，覆盖 AI 面试、多模态助手、后台管理等核心模块。</p>
      <h3>// 核心特性</h3>
      <ul>
        <li>SSE 流式对话 + 会话记忆</li>
        <li>多模态解析（文本 / 图像 / 文件）</li>
        <li>后台异步任务队列</li>
        <li>Docker 一键部署</li>
      </ul>
      <h3>// 个人贡献</h3>
      <p>独立负责从前端 UI、后端 API 到数据库设计与部署的全链路开发。</p>
    `,
    repo:"https://gitee.com/liuziqiongwjk/cloud-innovation-club"
  },
  vla:{
    id:"02",
    category:"DATA VIZ · ROBOTICS",
    title:"机器人 VLA 数据集可视化校验工具",
    meta:[
      {k:"技术栈","v":"Python FastAPI · OpenCV · Pandas · ECharts"},
      {k:"适配格式","v":"LeRobot v3.0"},
      {k:"类型","v":"工具 / 数据大屏"}
    ],
    html:`
      <p>面向具身智能/机器人学习场景的数据集可视化与质检工具。</p>
      <h3>// 核心能力</h3>
      <ul>
        <li>双摄视频逐帧回放 + 时间轴对齐</li>
        <li>关节角度 / 力控传感器时序曲线</li>
        <li>数据完整性校验 + 异常标记</li>
        <li>大赛产线数据大屏</li>
      </ul>
    `,
    repo:"https://gitee.com/liuziqiongwjk/vla_data"
  },
  leap:{
    id:"03",
    category:"AI AGENT · HR TECH",
    title:"Leap AI 面试系统",
    meta:[
      {k:"技术方向","v":"LLM Agent · Prompt Engineering · 流式交互"},
      {k:"类型","v":"AI 应用"}
    ],
    html:`
      <p>LLM Agent 驱动的智能面试助手与评估系统。</p>
      <h3>// 产品价值</h3>
      <ul>
        <li>自动化面试流程：预约 → 提问 → 追问 → 结束</li>
        <li>基于候选答案的动态智能追问</li>
        <li>多维度评分与综合评估报告</li>
        <li>帮助企业提升面试效率与标准化程度</li>
      </ul>
    `,
    repo:"https://gitee.com/liuziqiongwjk/leap-interview"
  },
  math:{
    id:"04",
    category:"AI AGENT · EDU",
    title:"数模解题辅助平台",
    meta:[
      {k:"技术方向","v":"AI Agent · 数据分析 · 自动化报告"},
      {k:"类型","v":"竞赛辅助 / 科研工具"}
    ],
    html:`
      <p>面向数学建模竞赛与科研场景的 AI Agent 工具链。</p>
      <h3>// 核心模块</h3>
      <ul>
        <li>数据清洗与预处理</li>
        <li>指标计算与模型推荐</li>
        <li>论文草稿自动生成</li>
        <li>从问题分析到报告产出的全流程覆盖</li>
      </ul>
    `,
    repo:"https://gitee.com/math-agent/math-agent"
  }
};

const params = new URLSearchParams(location.search);
const id = params.get("id");
const data = projects[id];
const app = document.getElementById("app");

if(!data){
  app.innerHTML = `
    <div class="not-found">
      <h1>404</h1>
      <p style="color:var(--muted);margin-bottom:2rem">项目不存在或 ID 无效</p>
      <a class="repo-link" href="index.html">← 返回首页</a>
    </div>`;
}else{
  const metaHtml = data.meta.map(m=>`<span class="meta-chip"><b>${m.k}</b>${m.v}</span>`).join("");
  app.innerHTML = `
    <header class="hero reveal">
      <div class="tag">◆ ${data.category}</div>
      <h1>${data.title}</h1>
      <div class="meta-row">${metaHtml}</div>
    </header>
    <div class="content reveal">
      ${data.html}
      <a class="repo-link" href="${data.repo}" target="_blank">🔗 查看 Gitee 仓库</a>
    </div>
  `;
}

// Scroll reveal
const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
  });
},{threshold:0.12});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
</body>
</html>
